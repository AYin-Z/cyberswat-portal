# CyberSWAT 门户 — 容器编排（主站）
# 端口/域名注册表见 docs/INFRA.md（单一事实源）；本文件只描述主站服务

services:
  cyberswat-main:
    build: .
    image: cyberswat-main:latest
    container_name: cyberswat-main
    restart: unless-stopped
    ports:
      - '127.0.0.1:8091:80'
    # 只绑本机回环 — CF Tunnel 本地连接，公网不直开
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
